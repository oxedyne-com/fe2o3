[package]
name = "oxedyne_fe2o3_sys"
version = "0.5.0"
authors = ["h00gs <hello@oxedyne.io>"]
edition = "2021"
license = "BSD-2-Clause/Apache-2.0"
description = "Hematite host-statistics library: reads CPU, memory, load, disk, network and process metrics from the operating system."
repository = "https://github.com/oxedyne-io/fe2o3"

[dependencies]
oxedyne_fe2o3_core              = { path = "../fe2o3_core" }

[features]
# inotify: a safe Linux watcher for directory trees, built on nix. Off by default
# so that every other user of this crate stays free of third-party dependencies.
inotify = ["dep:nix"]
# clock: the boot clock and a check for the machine having slept, which `Instant` cannot
# see. Off by default for the same reason.
clock = ["dep:nix", "nix/time"]
# signal: signals to the caller's own process group and to one process, safe over nix. Off by
# default for the same reason.
signal = ["dep:nix", "nix/signal", "nix/process"]
# supervise: spawns a child confined to a cgroup v2 memory cap under a delegated root, or to an
# address-space rlimit where there is none, arms a child's death with its parent's, and keeps a
# restart budget. Builds on signal.
supervise = ["signal"]

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["inotify", "poll"], optional = true }
