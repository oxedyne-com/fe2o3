[package]
name = "oxedyne_fe2o3_jdat"
version = "0.5.0"
authors = ["h00gs <hello@oxedyne.io>"]
edition = "2021"
license = "BSD-2-Clause/Apache-2.0"
description = "Hematite library for daticles, a simple type extension layer providing serialisation and deserialisation, and Jason's Data and Type (jdat) text format, a superset of JSON."
repository = "https://github.com/oxedyne-io/fe2o3"

[dependencies]
oxedyne_fe2o3_core 		   		= { path = "../fe2o3_core" }
oxedyne_fe2o3_num 				= { path = "../fe2o3_num" }
oxedyne_fe2o3_text 				= { path = "../fe2o3_text" }
dat_map 						= { path = "dat_map" }

bigdecimal = "0.2.0"
num-bigint = "0.3"
num-traits = "0.2"
rand_core = { version = "0.6.3", features = ["std"] }
tokio = { version = "1.35", default-features = false, features = ["io-util"], optional = true }

[features]
# The libtest benches (`#![feature(test)]`), which build only on nightly:
# `cargo +nightly bench -p oxedyne_fe2o3_jdat --features nightly`.
nightly = []
# Length-prefixed BDAT frames over tokio's AsyncRead and AsyncWrite (`pipe`), off by default so a
# wasm or synchronous user of this crate pulls in no tokio.
pipe = ["dep:tokio"]

[dev-dependencies]
oxedyne_fe2o3_hash 				= { path = "../fe2o3_hash" }
oxedyne_fe2o3_test 				= { path = "../fe2o3_test" }

# The independent RFC 8259 reader `Dat::decode_json_strict` is held to in tests/json_strict.rs.
# Tests only; the crate itself reads JSON with its own code.
serde_json = "1"

num-bigint = "0.3"
tokio = { version = "1.35", features = ["rt", "net", "io-util", "macros", "time"] }
syn = "1.0"
quote = "1.0"

[[bench]]
name = "bytes"
required-features = ["nightly"]
