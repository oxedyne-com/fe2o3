[package]
name = "oxedyne_fe2o3_font"
version = "0.5.0"
authors = ["h00gs <hello@oxedyne.io>"]
edition = "2021"
license = "BSD-2-Clause/Apache-2.0"
description = "Hematite font layer: parse, shape, metrics and glyph outlines, over a fallback chain of faces."
repository = "https://github.com/oxedyne-io/fe2o3"

[lib]
path = "src/lib.rs"

[dependencies]
oxedyne_fe2o3_core 		= { path = "../fe2o3_core" }
oxedyne_fe2o3_graphics 		= { path = "../fe2o3_graphics" }
oxedyne_fe2o3_text 		= { path = "../fe2o3_text" }

# The only third-party code in the crate, at two boundaries and nowhere else: shaping, and glyph
# outlines. Both are pure Rust with no unsafe and no C. See the crate docs for why these two and
# nothing more.
harfrust 			= "0.12"
skrifa 				= "0.44"

[dev-dependencies]
oxedyne_fe2o3_test 		= { path = "../fe2o3_test" }
