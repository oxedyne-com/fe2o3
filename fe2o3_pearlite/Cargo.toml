[package]
name = "oxedyne_fe2o3_pearlite"
version = "0.5.0"
authors = ["h00gs <hello@oxedyne.io>"]
edition = "2021"
license = "BSD-2-Clause/Apache-2.0"
description = "Pearlite: a native .prl reader -- raster to PNG, and a loopback browser-shell app sharing the web reader's own JS."
repository = "https://github.com/oxedyne-io/fe2o3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pearlite"
path = "src/bin/pearlite.rs"

[dependencies]
oxedyne_fe2o3_austenite	= { path = "../fe2o3_austenite" }
oxedyne_fe2o3_graphics	= { path = "../fe2o3_graphics" }
oxedyne_fe2o3_core		= { path = "../fe2o3_core" }
# Collaboration backend: signed operation history (ore), the neutral serialisation
# it and the store speak (jdat), the wasm-clean P-256 verifier (crypto, p256
# feature only), the hub store (o3db) and the thin blocking database trait it is
# reached through (iop_db). No new external crates: the p256 feature enables a
# dependency fe2o3_crypto already declares.
oxedyne_fe2o3_ore		= { path = "../fe2o3_ore" }
oxedyne_fe2o3_jdat		= { path = "../fe2o3_jdat" }
oxedyne_fe2o3_crypto	= { path = "../fe2o3_crypto", features = ["p256"] }
oxedyne_fe2o3_o3db_sync	= { path = "../fe2o3_o3db_sync" }
oxedyne_fe2o3_iop_db	= { path = "../fe2o3_iop_db" }
# SHA-256 for binding a signer's key to its replica identity; the same wasm-clean
# hasher fe2o3_crypto's p256 verifier already rests on.
oxedyne_fe2o3_hash		= { path = "../fe2o3_hash" }
# The loopback browser-shell's static server (`http::local`), and the ring-backed
# P-256 verifier (`ecdsa`) the integration test uses as a stand-in for a browser's
# WebCrypto key. Both are tokio-free, so `default-features = false` keeps the whole
# async/TLS half of the crate -- and tokio -- out of this reader entirely.
oxedyne_fe2o3_net		= { path = "../fe2o3_net", default-features = false }

[dev-dependencies]
# The checksum scheme an o3db instance is parameterised over comes from
# fe2o3_hash, which is now a normal dependency (see above).
