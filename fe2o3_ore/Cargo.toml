[package]
name = "oxedyne_fe2o3_ore"
version = "0.5.0"
authors = ["h00gs <hello@oxedyne.io>"]
edition = "2021"
license = "BSD-2-Clause/Apache-2.0"
description = "Hematite operation-based version control primitives, where the unit of history is a whole edit carrying signed provenance."
repository = "https://github.com/oxedyne-io/fe2o3"

[dependencies]
oxedyne_fe2o3_core 		   		= { path = "../fe2o3_core" }
oxedyne_fe2o3_jdat 		   		= { path = "../fe2o3_jdat" }
# Default features off keeps rayon, which is unavailable on wasm32, out of the
# dependency graph; only the interval map is wanted here.
oxedyne_fe2o3_data 		   		= { path = "../fe2o3_data", default-features = false }
oxedyne_fe2o3_iop_crypto 		= { path = "../fe2o3_iop_crypto" }
oxedyne_fe2o3_iop_hash 			= { path = "../fe2o3_iop_hash" }
# Deflate, for the packed record kind. Default features resolve to miniz_oxide,
# which is pure Rust and builds for wasm32 like the rest of this crate; the C
# backend is not asked for and must not be.
flate2 							= "1.0"
