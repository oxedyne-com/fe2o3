[package]
name = "oxedyne_fe2o3_graphics"
version = "0.5.0"
authors = ["h00gs <hello@oxedyne.io>"]
edition = "2021"
license = "BSD-2-Clause/Apache-2.0"
description = "Hematite 2D graphics library: paths, an anti-aliased rasteriser, pixmaps and PNG."
repository = "https://github.com/oxedyne-io/fe2o3"

[dependencies]
oxedyne_fe2o3_core 		= { path = "../fe2o3_core" }
oxedyne_fe2o3_text 		= { path = "../fe2o3_text" }
flate2 				= "1.0"

[features]
# Compiles the bytes of the FOGRA39L Coated profile (data/icc/, CC0) into the crate.  Off by default,
# so a build that never reads the profile, a wasm package above all, carries none of its bytes.
fogra39 = []

[dev-dependencies]
