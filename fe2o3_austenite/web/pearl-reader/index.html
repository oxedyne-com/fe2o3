<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pearl Reader</title>
<style>
	:root {
		--bg:    #6b7280;
		--panel: #ffffff;
		--ink:   #1f2937;
		--line:  #d1d5db;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; }
	body {
		font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
		color: var(--ink);
		background: var(--bg);
	}
	header {
		position: sticky; top: 0; z-index: 5;
		display: flex; align-items: center; gap: 12px;
		padding: 10px 16px;
		background: var(--panel);
		border-bottom: 1px solid var(--line);
	}
	header h1 { font-size: 15px; margin: 0; font-weight: 600; }
	header .sp { flex: 1; }
	select, button {
		font: inherit; padding: 4px 8px;
		border: 1px solid var(--line); border-radius: 6px; background: #fff;
	}
	#status { color: #4b5563; font-variant-numeric: tabular-nums; }
	#tocToggle { cursor: pointer; }
	#tocToggle[aria-pressed="true"] { background: #2563eb; color: #fff; border-color: #2563eb; }
	#pages { padding: 24px 16px 64px; display: flex; flex-direction: column; align-items: center; gap: 24px; }

	/* The contents outline: a sticky left rail below the header, shown when a document carries an outline
	   and the reader has it open. It flows the page column right on a wide screen and overlays on a narrow
	   one, so the reading area is never wedged. */
	#toc {
		position: fixed; top: 49px; left: 0; bottom: 0; width: 264px; z-index: 4;
		overflow-y: auto; padding: 12px 10px 40px;
		background: var(--panel); border-right: 1px solid var(--line);
	}
	#toc[hidden] { display: none; }
	.toc-head { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
		color: #6b7280; padding: 4px 6px 8px; }
	.toc-tree, .toc-children { list-style: none; margin: 0; padding: 0; }
	.toc-children { padding-left: 14px; }
	.toc-item.has-children:not(.open) > .toc-children { display: none; }
	.toc-row { display: flex; align-items: flex-start; gap: 2px; }
	.toc-caret {
		flex: 0 0 auto; width: 18px; height: 22px; padding: 0; margin: 0;
		border: none; background: none; color: #9ca3af; cursor: pointer;
		font-size: 11px; line-height: 22px; text-align: center; border-radius: 4px;
	}
	.toc-caret.empty { cursor: default; visibility: hidden; }
	.toc-caret:hover { background: #f3f4f6; color: #4b5563; }
	.toc-link {
		flex: 1 1 auto; min-width: 0; text-align: left; padding: 3px 6px; margin: 0;
		border: none; background: none; border-radius: 5px; cursor: pointer;
		color: var(--ink); font: inherit; line-height: 1.35;
	}
	.toc-link:hover { background: #eff6ff; color: #1d4ed8; }
	.toc-item.lvl-1 > .toc-row > .toc-link { font-weight: 600; }
	.toc-item.lvl-2 > .toc-row > .toc-link { font-size: 13px; }
	.toc-item.lvl-3 > .toc-row > .toc-link,
	.toc-item.lvl-4 > .toc-row > .toc-link { font-size: 12.5px; color: #374151; }
	.toc-link .toc-num { color: #9ca3af; margin-right: 6px; font-variant-numeric: tabular-nums; }
	.toc-link.dead { color: #b91c1c; cursor: default; }
	.toc-link.dead:hover { background: none; }
	body.toc-open #pages { padding-left: 280px; }

	@media (max-width: 720px) {
		#toc { width: min(80vw, 300px); box-shadow: 2px 0 16px rgba(0,0,0,.25); }
		body.toc-open #pages { padding-left: 16px; }
	}
	.pearl-page {
		position: relative;                 /* the overlay layer is absolute within the page */
		background: #fff;
		box-shadow: 0 2px 10px rgba(0,0,0,.35);
	}
	.pearl-page svg { display: block; }

	/* The overlay sits exactly over the SVG (1 user unit = 1 px), carrying links and annotations. */
	.pearl-overlay { position: absolute; inset: 0; pointer-events: none; }
	.pearl-overlay > * { pointer-events: auto; }

	/* A link hotspot: a subtle box while idle, a clear underline and tint on hover, so a reader sees it. */
	.pearl-link {
		position: absolute; display: block;
		border-bottom: 1.5px solid rgba(37,99,235,.55);
		border-radius: 2px;
		background: rgba(37,99,235,.06);
		cursor: pointer; text-decoration: none;
	}
	.pearl-link:hover  { background: rgba(37,99,235,.18); border-bottom-color: rgba(37,99,235,.95); }
	.pearl-link.int    { border-bottom-style: dashed; }
	.pearl-link.dead   { border-bottom-color: rgba(220,38,38,.7); background: rgba(220,38,38,.08); }

	/* A highlight: a translucent amber wash over the annotated region. */
	.pearl-highlight {
		position: absolute;
		background: rgba(250,204,21,.38);
		mix-blend-mode: multiply;
		border-radius: 2px;
	}

	/* A note marker in the left margin, with a bubble that opens on click. */
	.pearl-note {
		position: absolute; left: -14px;
		width: 26px; height: 26px; padding: 0;
		border: 1px solid #c084fc; border-radius: 50%;
		background: #f5f3ff; color: #6b21a8;
		font-size: 13px; line-height: 1; cursor: pointer;
	}
	.pearl-note:hover { background: #ede9fe; }
	.pearl-note-bubble {
		display: none; position: absolute; left: 32px; top: 0;
		width: 220px; padding: 8px 10px; z-index: 10;
		background: #fff; border: 1px solid #c084fc; border-radius: 8px;
		box-shadow: 0 4px 14px rgba(0,0,0,.2);
		text-align: left; cursor: default;
	}
	.pearl-note-bubble.open { display: block; }
	.pearl-note-text { color: #1f2937; }
	.pearl-note-meta { margin-top: 6px; color: #6b7280; font-size: 12px; }

	/* Authoring toolbar. */
	#author { width: 90px; }
	#annotate.on { background: #2563eb; color: #fff; border-color: #2563eb; }
	#pages.annotating .pearl-page { cursor: crosshair; }
	/* In annotate mode existing overlay items must not swallow a drag that starts over them. */
	#pages.annotating .pearl-link,
	#pages.annotating .pearl-highlight,
	#pages.annotating .pearl-note { pointer-events: none; }

	/* The live selection while dragging out a region. */
	.pearl-draw {
		position: absolute; pointer-events: none;
		background: rgba(37,99,235,.14);
		border: 1.5px dashed rgba(37,99,235,.85);
		border-radius: 2px;
	}

	/* The composer popover shown after a drag. */
	.pearl-composer {
		position: absolute; z-index: 30; width: 240px; padding: 10px;
		background: #fff; border: 1px solid #94a3b8; border-radius: 8px;
		box-shadow: 0 6px 20px rgba(0,0,0,.28);
		text-align: left; cursor: default;
	}
	.pearl-composer .pc-row { display: flex; align-items: center; gap: 8px; }
	.pearl-composer .pc-kind { margin-bottom: 6px; }
	.pearl-composer label { font-size: 13px; }
	.pearl-composer .pc-payload {
		width: 100%; margin-bottom: 8px; font: inherit; padding: 4px 6px;
		border: 1px solid var(--line); border-radius: 6px; resize: vertical;
	}
	.pearl-composer .pc-author { flex: 1; min-width: 0; padding: 3px 6px;
		border: 1px solid var(--line); border-radius: 6px; font: inherit; }
	.pearl-composer .pc-sp { flex: 1; }
	.pearl-composer .pc-save { background: #2563eb; color: #fff; border-color: #2563eb; }

	/* Drag-and-drop affordance covering the viewport while a file hovers. */
	#drop {
		position: fixed; inset: 0; z-index: 20; display: none;
		align-items: center; justify-content: center;
		background: rgba(37,99,235,.12);
		border: 3px dashed rgba(37,99,235,.7);
	}
	#drop.on { display: flex; }
	#drop span {
		padding: 16px 24px; border-radius: 10px;
		background: #fff; font-size: 16px; font-weight: 600; color: #1e3a8a;
	}
</style>
</head>
<body>
<header>
	<button id="tocToggle" type="button" title="Show or hide the contents outline" aria-pressed="false" hidden>&#9776; Contents</button>
	<h1>Pearl Reader <span style="font-weight:400;color:#6b7280">&mdash; .prl v1</span></h1>
	<label>Document
		<select id="doc">
			<option value="samples/hierarchy.prl">hierarchy (outline + lists)</option>
			<option value="samples/demo.prl">demo (links + annotations)</option>
			<option value="samples/keystone.prl">keystone (1 page)</option>
			<option value="samples/manuscript.prl">manuscript (3 pages)</option>
			<option value="samples/maths.prl">maths (1 page)</option>
			<option value="samples/raster.prl">raster (1 page)</option>
		</select>
	</label>
	<button id="open" type="button">Open file…</button>
	<input id="file" type="file" accept=".prl" hidden>
	<button id="annotate" type="button" title="Toggle annotation authoring">Annotate</button>
	<label>as <input id="author" type="text" value="me"></label>
	<button id="save" type="button" title="Download the .prl with your annotations">Save .prl</button>
	<span class="sp"></span>
	<span id="status"></span>
</header>
<div id="drop"><span>Drop a .prl to open</span></div>
<nav id="toc" aria-label="Document contents" hidden>
	<div class="toc-head">Contents</div>
	<div id="tocBody"></div>
</nav>
<main id="pages"></main>

<script src="jdat.js"></script>
<script src="pearl.js"></script>
<script src="authoring.js"></script>
<script>
	const sel      = document.getElementById("doc");
	const pages    = document.getElementById("pages");
	const statusEl = document.getElementById("status");
	const fileInput = document.getElementById("file");
	const openBtn   = document.getElementById("open");
	const drop      = document.getElementById("drop");
	const annotateBtn = document.getElementById("annotate");
	const authorInput = document.getElementById("author");
	const saveBtn     = document.getElementById("save");
	const toc         = document.getElementById("toc");
	const tocBody     = document.getElementById("tocBody");
	const tocToggle   = document.getElementById("tocToggle");

	// The current document and its display name, so authoring knows what it is editing and saving.
	let currentDoc  = null;
	let currentName = "document.prl";

	// Reports what was rendered: page and glyph counts, plus any links and annotations, so the header
	// confirms the demo features are present.
	function report(doc, name) {
		const g = Object.keys(doc.glyphs).length;
		let links = 0;
		for (let i = 0; i < doc.index.length; i++) links += Pearl.linksOnPage(doc, i).length;
		const anns = (doc.annotations || []).length;
		const extra = (links ? ` · ${links} link(s)` : "") + (anns ? ` · ${anns} annotation(s)` : "");
		statusEl.textContent = `${name ? name + " · " : ""}${doc.index.length} page(s) · ${g} glyphs${extra}`;
	}

	// Registers a freshly rendered document with the authoring layer and reports it.
	function adopt(doc, name) {
		currentDoc  = doc;
		currentName = name || currentName;
		Authoring.setDocument(doc, currentName);
		report(doc, name);
		buildToc(doc);
	}

	// Scrolls a heading into view: the page it landed on, offset by its own y so the jump lands on the
	// heading's line rather than the page top. The header is sticky, so a little clearance is left above.
	function jumpTo(entry) {
		if (entry.page == null) return;
		const pageEl = pages.querySelectorAll(".pearl-page")[entry.page - 1];
		if (!pageEl) return;
		const yOffset = entry.y != null ? Pearl.sp(entry.y) : 0;
		const top = pageEl.getBoundingClientRect().top + window.scrollY + yOffset - 64;
		window.scrollTo({ top, behavior: "smooth" });
	}

	// Builds the collapsible outline tree from `doc.outline`, nesting each entry under the nearest
	// shallower one by its level. A document with no outline hides the rail and its toggle; one with an
	// outline shows both, open by default. The tree is rebuilt whole for each document.
	function buildToc(doc) {
		const entries = Pearl.outlineEntries(doc);
		tocBody.innerHTML = "";
		if (entries.length === 0) {
			setTocOpen(false);
			tocToggle.hidden = true;
			toc.hidden = true;
			return;
		}
		tocToggle.hidden = false;

		const root = document.createElement("ul");
		root.className = "toc-tree";
		const stack = [{ level: 0, ul: root }];
		for (const e of entries) {
			while (stack.length > 1 && stack[stack.length - 1].level >= e.level) stack.pop();
			const parentUl = stack[stack.length - 1].ul;

			const li = document.createElement("li");
			li.className = "toc-item lvl-" + e.level;

			const row = document.createElement("div");
			row.className = "toc-row";
			const caret = document.createElement("button");
			caret.type = "button";
			caret.className = "toc-caret empty";
			row.appendChild(caret);

			const link = document.createElement("button");
			link.type = "button";
			link.className = "toc-link";
			if (e.number) {
				const num = document.createElement("span");
				num.className = "toc-num";
				num.textContent = e.number;
				link.appendChild(num);
			}
			link.appendChild(document.createTextNode(e.title));
			if (e.page == null) {
				link.classList.add("dead");
				link.title = "not placed in this document";
			} else {
				link.title = "page " + e.page;
				link.addEventListener("click", () => jumpTo(e));
			}
			row.appendChild(link);
			li.appendChild(row);
			parentUl.appendChild(li);

			const childUl = document.createElement("ul");
			childUl.className = "toc-children";
			li.appendChild(childUl);
			stack.push({ level: e.level, ul: childUl, li, caret });
		}

		// Turn a caret into a working toggle only where the item actually has children; leave it hidden
		// (but space-holding) otherwise, so the titles line up whether or not a heading nests others.
		root.querySelectorAll("li.toc-item").forEach(li => {
			const childUl = li.querySelector(":scope > ul.toc-children");
			const caret   = li.querySelector(":scope > .toc-row > .toc-caret");
			if (childUl && childUl.children.length > 0) {
				li.classList.add("has-children", "open");
				caret.classList.remove("empty");
				caret.textContent = "▾";  // a down-pointing triangle: open
				caret.addEventListener("click", () => {
					const open = li.classList.toggle("open");
					caret.textContent = open ? "▾" : "▸";
				});
			}
		});

		tocBody.appendChild(root);
		setTocOpen(true);
	}

	// Opens or closes the contents rail, keeping the toggle's pressed state and the page column's shift in
	// step. The rail is only meaningful when a document carries an outline, so the toggle is hidden otherwise.
	function setTocOpen(open) {
		toc.hidden = !open;
		document.body.classList.toggle("toc-open", open);
		tocToggle.setAttribute("aria-pressed", open ? "true" : "false");
	}

	tocToggle.addEventListener("click", () => setTocOpen(toc.hidden));

	// Renders a document already in memory as .prl text (a dropped or picked file).
	function showText(text, name) {
		statusEl.textContent = "rendering…";
		try {
			adopt(Pearl.renderText(text, pages), name);
		} catch (e) {
			statusEl.textContent = "error: " + e.message;
			console.error(e);
		}
	}

	// Renders a document fetched from a URL (the sample picker). It goes through text, not
	// `loadAndRender`, so the source is captured for the authoring splice.
	async function show(url) {
		statusEl.textContent = "loading…";
		try {
			const res = await fetch(url, { cache: "no-store" });
			if (!res.ok) throw new Error(`Failed to load ${url}: ${res.status}`);
			const name = url.split("/").pop();
			adopt(Pearl.renderText(await res.text(), pages), name);
		} catch (e) {
			statusEl.textContent = "error: " + e.message;
			console.error(e);
		}
	}

	// A local file, read as text through FileReader -- no server, no upload, so any .prl on disk opens.
	function openFile(file) {
		if (!file) return;
		const reader = new FileReader();
		reader.onload  = () => showText(reader.result, file.name);
		reader.onerror = () => { statusEl.textContent = "error: could not read " + file.name; };
		reader.readAsText(file);
	}

	openBtn.addEventListener("click", () => fileInput.click());
	fileInput.addEventListener("change", () => openFile(fileInput.files[0]));

	// Drag-and-drop anywhere on the window opens the dropped .prl.
	let dragDepth = 0;
	window.addEventListener("dragenter", (e) => { e.preventDefault(); if (++dragDepth === 1) drop.classList.add("on"); });
	window.addEventListener("dragover",  (e) => { e.preventDefault(); });
	window.addEventListener("dragleave", (e) => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; drop.classList.remove("on"); } });
	window.addEventListener("drop", (e) => {
		e.preventDefault();
		dragDepth = 0; drop.classList.remove("on");
		if (e.dataTransfer.files.length) openFile(e.dataTransfer.files[0]);
	});

	// A ?doc= query overrides the picker, so a headless driver can name the file.
	const q = new URLSearchParams(location.search).get("doc");
	if (q) {
		const opt = [...sel.options].find(o => o.value.endsWith(q) || o.value === q);
		if (opt) sel.value = opt.value;
		else { sel.insertAdjacentHTML("beforeend", `<option value="${q}" selected>${q}</option>`); }
	}
	sel.addEventListener("change", () => show(sel.value));

	// Wire the authoring layer: the toggle, the author field and the save button, and re-report the count
	// after each new annotation so the header reflects it live.
	Authoring.init({
		container:   pages,
		toggle:      annotateBtn,
		authorInput: authorInput,
		save:        saveBtn,
		onChange:    () => { if (currentDoc) report(currentDoc, currentName); },
	});

	show(sel.value);
</script>
</body>
</html>
