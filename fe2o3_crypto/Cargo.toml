[package]
name = "oxedyne_fe2o3_crypto"
version = "0.5.0"
authors = ["h00gs <hello@oxedyne.io>"]
edition = "2021"
license = "BSD-2-Clause/Apache-2.0"
description = "Hematite cryptographic library."
repository = "https://github.com/oxedyne-io/fe2o3"

build = "build.rs"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = [ "mode2", "pq", "batch" ]
mode0 = []
mode1 = []
mode2 = []
mode3 = []

# Ed25519 batch verification, which checks a whole set of signatures for far
# less than the sum of the parts: one multi-scalar equation, the cofactored sum
# of each signature's own equation under a 128-bit coefficient (`sign.rs`,
# `holds`). The coefficients are drawn by hashing the inputs themselves rather
# than by asking the operating system for randomness, so this compiles to wasm32
# along with the rest of the pure-Rust subset, and a reader in a browser verifies
# a history rather than trusting a server to have done it. It needs nothing
# beyond `curve25519-dalek` and `sha2`, already here.
#
# Turn it off and `SignatureScheme::verify_batch` still decompresses each public
# key once and then checks the set one signature at a time. The set of
# signatures accepted is the same either way; only the cost differs.
batch = []

# ECDSA P-256 (NIST secp256r1) signature *verification*, pure Rust and wasm-clean.
# Verify only: signing and key generation stay host-side (WebCrypto, Secure
# Enclave, Android Keystore), so nothing on this path asks the operating system
# for randomness and it compiles to wasm32-unknown-unknown. It rests on the
# RustCrypto `p256` crate, the NIST-curve peer of the `ed25519-dalek` this crate
# already carries. Off by default, so a native build is unchanged; a browser
# build turns it on to check a device's P-256 signature on-device rather than
# trusting a server to have checked it. The message digest is taken from
# `fe2o3_hash`, so no separate hasher is compiled in on the verify path.
p256 = [ "dep:p256" ]

# The post-quantum schemes that rest on C: the SABER key exchange, whose reference implementation
# this crate compiles and binds with bindgen, and the C wrapper behind `SignatureScheme::Dilithium2`.
# They need a C toolchain, OpenSSL and bindgen, none of which exist in a browser.
#
# Turn this off and what remains is pure Rust: Ed25519, AES-GCM, SHA3, and the pure-Rust Dilithium
# of `SignatureScheme::Dilithium2_fe2o3`. That subset compiles to wasm32, which is what lets a
# reader verify a signature in a browser instead of trusting a server to have done it. On by
# default, so a native build is unchanged.
pq = [
	"dep:pqcrypto-dilithium",
	"dep:pqcrypto-traits",
	"dep:bindgen",
]

[dependencies]
oxedyne_fe2o3_core 				= { path = "../fe2o3_core" }
oxedyne_fe2o3_data 				= { path = "../fe2o3_data" }
oxedyne_fe2o3_hash 				= { path = "../fe2o3_hash" }
oxedyne_fe2o3_iop_crypto		= { path = "../fe2o3_iop_crypto" }
oxedyne_fe2o3_iop_hash 			= { path = "../fe2o3_iop_hash" }
oxedyne_fe2o3_jdat 				= { path = "../fe2o3_jdat" }
oxedyne_fe2o3_namex				= { path = "../fe2o3_namex" }
oxedyne_fe2o3_text 				= { path = "../fe2o3_text" }

# std reqd to activate impl std::error::Error for aead::Error
aes-gcm = { version = "0.10.3", features = ["std"] }

console_error_panic_hook= "0.1.6"
# Already in the graph through ed25519-dalek, and named here so that
# `agree` can reach MontgomeryPoint and `sign` can verify Ed25519 strictly
# with its own equations. Nothing new is compiled for it.
curve25519-dalek = "4.1.3"
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
# P-256 ECDSA verification only; see the `p256` feature. `default-features` is off
# so no `std`, and only the `ecdsa` surface is compiled, keeping `getrandom` off
# the verify path so the crate still builds for wasm32-unknown-unknown.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }
pqcrypto-dilithium = { version = "0.4.5", optional = true }
pqcrypto-traits = { version = "0.3.4", optional = true }
rand_core = { version = "0.6.3", features = ["std"] }
rand = { version = "0.8.4" }
secrecy = "0.8.0"
# SHA-512 for linkring's RFC 9380 hash to ristretto255 and for the Ed25519
# challenge in strict verification. Already compiled for ed25519-dalek, so
# nothing new is built.
sha2 = { version = "0.10", default-features = false }
tiny-keccak = { version = "2.0.2", features = ["sha3", "shake"] }
wasm-bindgen = "0.2.71"
zeroize = { version = "1.4.2", features = ["zeroize_derive"] }

###### Dilithium
arrayref = "0.3"
itertools = "0.7"
byteorder = "1"
sha3 = "0.7"
digest = "0.7"
# Needed for Dilithium _and_ ed25519-dalek
rand_core_old = { package = "rand_core", version = "0.5.0", features = ["std"] }
rand_old = { package = "rand", version = "0.7.0" }

[dev-dependencies]
oxedyne_fe2o3_data 				= { path = "../fe2o3_data" }
oxedyne_fe2o3_text 				= { path = "../fe2o3_text" }
libc = "0.2"
# Dilithium
hex = "0.3"
# The P-256 differential oracle. `ring` is the backend of `fe2o3_net::ecdsa`, so
# checking against `ring` directly is the same test as checking against that
# module, without a dev-dependency cycle (fe2o3_net depends on this crate). Test
# only, native only.
ring = "0.17"

[build-dependencies]
bindgen = { version = "0.66.1", optional = true }
