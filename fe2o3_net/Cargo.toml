[package]
name = "oxedyne_fe2o3_net"
version = "0.5.0"
authors = ["h00gs <hello@oxedyne.io>"]
edition = "2021"
license = "BSD-2-Clause/Apache-2.0"
description = "Hematite networking library."
repository = "https://github.com/oxedyne-io/fe2o3"

[features]
# The async/TLS half of the crate: the tokio-driven HTTP/WebSocket/SMTP/IMAP
# servers and clients, the ACME and TLS machinery, and everything that links
# tokio, tokio-rustls or rcgen. On by default, so every existing caller is
# unchanged. A caller that only needs the tokio-free surface -- the std-only
# `http::local` server, the address and media types, the presentation shapes --
# turns it off with `default-features = false` and links none of that. TLS and
# ACME rest on `ring`, so this takes it too.
default = ["async", "ring"]
async = ["ring", "dep:tokio", "dep:tokio-rustls", "dep:rcgen"]

# The modules that rest on `ring`, a library of C and assembly: ACME and JOSE,
# DKIM, the ECDSA and HMAC verifiers and WebAuthn. On by default. With
# `default-features = false` the crate carries none of it and compiles to
# wasm32-unknown-unknown, which is how a browser client reaches
# `presentation::shape` and builds the bytes a verifier here rebuilds.
ring = ["dep:ring"]

[dependencies]
oxedyne_fe2o3_core 					= { path = "../fe2o3_core" }
# Its defaults would build the C post-quantum code, which nothing here uses and
# which cannot target wasm32. `presentation` needs only Ed25519 and `linkring`.
oxedyne_fe2o3_crypto				= { path = "../fe2o3_crypto", default-features = false, features = ["mode2"] }
oxedyne_fe2o3_data 					= { path = "../fe2o3_data" }
oxedyne_fe2o3_geom 					= { path = "../fe2o3_geom" }
oxedyne_fe2o3_jdat 					= { path = "../fe2o3_jdat" }
oxedyne_fe2o3_hash 					= { path = "../fe2o3_hash" }
oxedyne_fe2o3_iop_crypto			= { path = "../fe2o3_iop_crypto" }
oxedyne_fe2o3_iop_db 				= { path = "../fe2o3_iop_db" }
oxedyne_fe2o3_iop_hash 				= { path = "../fe2o3_iop_hash" }
oxedyne_fe2o3_stds 					= { path = "../fe2o3_stds" }
oxedyne_fe2o3_syntax				= { path = "../fe2o3_syntax" }
oxedyne_fe2o3_text					= { path = "../fe2o3_text" }

base64 = "0.13.0"
chrono = "0.4"
flate2 = "1.0"
rcgen = { version = "0.12.0", optional = true }
ring = { version = "0.17", optional = true }
secrecy = "0.8.0"
sha1 = "0.10.6"
strum = { version = "0.25", features = ["derive"] }
tokio = { version = "1.35", features = ["full"], optional = true }
# Rustls on `ring`, which this crate already carries, rather than on its default
# `aws-lc-rs`. Taking the default meant every caller linked a second cryptography
# library in C -- including callers that serve plain HTTP and use none of it --
# and cross-compiling it for Windows builds its POSIX threading backend for a
# target with no pthreads, so the link then needs the posix mingw and
# `-lwinpthread`. `fe2o3_steel` already pins rustls this way.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }

[dev-dependencies]
oxedyne_fe2o3_data 					= { path = "../fe2o3_data" }
