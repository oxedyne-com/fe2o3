[package]
name = "oxedyne_fe2o3_geom"
version = "0.5.0"
authors = ["h00gs <hello@oxedyne.io>"]
edition = "2021"
license = "BSD-2-Clause/Apache-2.0"
description = "Hematite geometry library."
repository = "https://github.com/oxedyne-io/fe2o3"

[dependencies]
oxedyne_fe2o3_core 		   		= { path = "../fe2o3_core" }

# Gzip, for PMTiles directories and tiles; already in the graph through fe2o3_core, and its
# miniz_oxide backend is pure Rust, so it builds for wasm32.
flate2 							= "1.0"

[dev-dependencies]
oxedyne_fe2o3_jdat 				= { path = "../fe2o3_jdat" }
